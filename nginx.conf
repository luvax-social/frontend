map $request_uri $lx_robots {
    default "noindex, follow";
    "/" "";
}

map $args $lx_entry_document {
    "" /index.html;
    default /spa.html;
}

map $args $lx_query_suffix {
    "" "";
    default "&$args";
}

server {
    listen 80;
    absolute_redirect off;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Robots-Tag $lx_robots always;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex";
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location = / {
        add_header X-Robots-Tag $lx_robots always;
        add_header Cache-Control "no-store" always;
        try_files $lx_entry_document =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = /spa.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location ~ ^/login/?$ {
        return 301 /$is_args$args;
    }

    location ~ ^/register/?$ {
        return 301 /?view=register$lx_query_suffix;
    }

    location ~ ^/forgot-password/?$ {
        return 301 /?view=forgot$lx_query_suffix;
    }

    # Only fingerprinted build assets can safely be immutable across releases.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ~ ^/(?:app|admin)(?:/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
        try_files /spa.html =404;
    }

    location ~ ^/(?:dashboard|verify-email|verify-email-notice|reset-password|oauth2/callback|support/(?:new|appeal(?:/status|/resend)?|confirm)|tags/[^/]+)/?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-store" always;
        try_files /spa.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
