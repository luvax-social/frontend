name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # This workflow validates the pull request title, and that is all it validated until now, so
  # nothing mechanically enforced the subject limit on the commits underneath it. A subject over
  # the limit reached develop that way. The job below closes that gap, and is kept in step with
  # the backend's copy.
  lint-commit-subjects:
    name: Lint commit subjects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks base..head, so the runner needs both commits present rather than the
          # single-commit default checkout.
          fetch-depth: 0
      - name: Reject a commit subject over 80 characters
        shell: bash
        # Invoked through bash rather than as a command. The script is committed mode 100644 and
        # actions/checkout restores that mode verbatim, so executing it directly is execve on a
        # non-executable file: exit 126 before the shebang is even read, on every pull request.
        # Naming the interpreter is smaller than carrying an executable bit in the index and
        # cannot be undone by the mode being lost again.
        run: >
          bash scripts/check_commit_subjects.sh
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            chore
            docs
            perf
            ci
          requireScope: true
          # Domain scopes first, matching the backend's list, then the frontend's own layer
          # scopes. Three lists disagreed before this: the workflow allowed only layer scopes,
          # .claude/rules/git_workflow.md documented the backend's domain list, and the commits
          # actually being written used support, luvax, recommendation and common - none of which
          # the workflow allowed. A feature slice under src/features/ is named for its domain, so
          # the domain names are the ones a title naturally takes.
          scopes: |
            admin
            auth
            comment
            common
            hashtag
            luvax
            mail
            media
            message
            messages
            notification
            post
            recommendation
            report
            search
            social
            story
            support
            users
            app
            dashboard
            routes
            layouts
            pages
            ui
            hooks
            services
            stores
            config
            assets
            build
            deps
            db
            docs
            ci
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter.
