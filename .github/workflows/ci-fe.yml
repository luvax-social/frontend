name: CI Frontend

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      # Runs before the build because it is faster and catches a different class of problem.
      # Absent until now, which is how 1,234 findings accumulated unchallenged, four of them
      # genuine Rules of Hooks violations rather than formatting.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests only. The live suite talks to a real API, database, and mail sink, none of
      # which exist here, so it stays a local and pre-release check.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
